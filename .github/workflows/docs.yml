name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MPLBACKEND: Agg

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation and example dependencies
        run: python -m pip install -e ".[docs]" pytest "mapie==1.5.0"
      - name: Verify the custom backend and MAPIE adapter
        run: |
          python -c "import mapie; print(mapie.__version__)"
          python -m pytest tests/test_extensibility.py -q
      - name: Build documentation with warnings treated as errors
        run: python -m mkdocs build --strict -f docs/mkdocs.yml
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
