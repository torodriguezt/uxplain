[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "uncertainty_explainer"
version = "0.1.0"
description = "Explainability for conformal prediction uncertainty — regression and classification."
authors = [
  { name = "Veronica Seguro Varela" },
  { name = "Tomas Rodriguez Taborda" },
  { name = "Rafael Izbicki" },
  { name = "Johnatan Cardona" },
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "conformal prediction",
    "uncertainty quantification",
    "explainability",
    "xai",
    "shap",
    "lime",
    "pdp",
    "machine learning",
    "interpretable ml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "crepes>=0.8",
    "lime>=0.2",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/vseguro/Uncertainty-Explainer"
Repository = "https://github.com/vseguro/Uncertainty-Explainer"
"Bug Tracker" = "https://github.com/vseguro/Uncertainty-Explainer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["uncertainty_explainer"]
include = ["pyproject.toml", "uncertainty_explainer/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["uncertainty_explainer"]
force-sort-within-sections = true

