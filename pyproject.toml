[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "uxplain"
dynamic = ["version"]
description = "Explainability for conformal prediction uncertainty — regression and classification."
authors = [
  { name = "Veronica Seguro Varela" },
  { name = "Tomas Rodriguez Taborda" },
  { name = "Rafael Izbicki" },
  { name = "Johnatan Cardona Jimenez" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "conformal prediction",
    "uncertainty quantification",
    "explainability",
    "xai",
    "shap",
    "lime",
    "pdp",
    "machine learning",
    "interpretable ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "crepes>=0.9.1",
    "lime>=0.2",
    "matplotlib>=3.8",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/torodriguezt/uxplain"
Repository = "https://github.com/torodriguezt/uxplain"
Documentation = "https://github.com/torodriguezt/uxplain/tree/main/docs/docs"
"Bug Tracker" = "https://github.com/torodriguezt/uxplain/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
release = [
    "build>=1.2",
    "twine>=6.1",
]
docs = ["mkdocs>=1.6"]

[tool.flit.sdist]
include = ["LICENSE", "README.md", "CHANGELOG.md", "pyproject.toml", "tests/"]
exclude = [
    "docs/",
    "notebooks/",
    "models/",
    "reports/",
    "references/",
    "replication/",
    "figures/",
    "uxplain-main/",
    "*.tex",
    "*.bib",
    "*.pdf",
    "*.zip",
    "SUBMISSION_CHECKLIST.md",
    "demo.ipynb",
    "Makefile",
    "requirements.txt",
    ".github/",
    "**/__pycache__/",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["uxplain"]
include = ["pyproject.toml", "uxplain/**/*.py"]
extend-exclude = ["uxplain-main"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["uxplain"]
force-sort-within-sections = true
